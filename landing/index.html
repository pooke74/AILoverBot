<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gizli Kulüp 🔥</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(139, 0, 255, 0.15), transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 80, 0.1), transparent 50%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 24px;
            max-width: 420px;
            width: 100%;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #aaa;
            font-size: 11px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 900;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        h1 span {
            background: linear-gradient(135deg, #ff006e, #8b00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 36px;
        }

        .cta-btn {
            display: block;
            width: 100%;
            padding: 18px 0;
            border-radius: 14px;
            background: linear-gradient(135deg, #8b00ff, #ff006e);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(139, 0, 255, 0.35);
            position: relative;
            overflow: hidden;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(139, 0, 255, 0.5);
        }

        .cta-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s ease-in-out infinite;
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }

            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 28px;
        }

        .stat {
            text-align: center;
        }

        .stat-num {
            color: #fff;
            font-size: 20px;
            font-weight: 900;
        }

        .stat-label {
            color: #666;
            font-size: 11px;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .warning {
            margin-top: 28px;
            color: #555;
            font-size: 11px;
            line-height: 1.5;
        }

        .warning span {
            color: #ff006e;
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>
    <div class="container">
        <div class="badge">🔒 Sadece Davetlilere Özel</div>
        <h1>Sana Özel <span>Gizli Kulüp</span>'e Hoş Geldin</h1>
        <p class="subtitle">Sansürsüz, filtresiz, tamamen anonim.<br>Favori karakterini seç ve hemen sohbete başla.</p>

        <a href="https://t.me/MiaQuenn_bot" class="cta-btn" id="ctaBtn">
            🔥 Gizli Kataloga Gir
        </a>

        <div class="stats">
            <div class="stat">
                <div class="stat-num pulse">🟢</div>
                <div class="stat-label">Şu an aktif</div>
            </div>
            <div class="stat">
                <div class="stat-num">4</div>
                <div class="stat-label">Karakter</div>
            </div>
            <div class="stat">
                <div class="stat-num">18+</div>
                <div class="stat-label">Yaş Sınırı</div>
            </div>
        </div>

        <p class="warning">⚠️ <span>Uyarı:</span> Kontenjan sınırlıdır. VIP erişim her an kapatılabilir.</p>
    </div>

    <script>
        // Basit tiklama sayaci (opsiyonel analytics)
        document.getElementById('ctaBtn').addEventListener('click', function () {
            // Eger Google Analytics veya benzeri eklemek istersen buraya koy
            console.log('CTA tiklandi');
        });
    </script>
</body>

</html>
